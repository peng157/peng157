<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>PTT 八卦版資料</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 20px;
        }
        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
        }
        th, td {
            padding: 10px;
            text-align: left;
            border: 1px solid #ddd;
        }
        th {
            background-color: #f2f2f2;
        }
        a {
            color: #007bff;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h1>PTT 八卦版資料</h1>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>標題</th>
                <th>內文連結</th>
                <th>日期</th>
                <th>人氣值</th>
            </tr>
        </thead>
        <tbody>
            {% for row in data %}
                <tr>
                    <td>{{ row['id'] }}</td>
                    <td>{{ row['title'] }}</td>
                    <td><a href="{{ row['link'] }}" target="_blank">點我查看</a></td>
                    <td>{{ row['date'] }}</td>
                    <td>{{ row['pop'] }}</td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
